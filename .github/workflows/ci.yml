name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / cgo=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true

      # windows-latest has no C compiler preinstalled; the other runners do.
      # egor-tensin/setup-mingw@v2 is broken against current chocolatey mingw
      # releases (its cleanup step removes a libpthread.dll.a that the
      # posix-seh-ucrt package no longer ships), so use msys2's ucrt64 gcc
      # instead — the same toolchain already used for local CGO dev builds.
      - name: Set up MSYS2 / MinGW (Windows, cgo=1 only)
        if: matrix.os == 'windows-latest' && matrix.cgo == '1'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add MSYS2 UCRT64 gcc to PATH (Windows, cgo=1 only)
        if: matrix.os == 'windows-latest' && matrix.cgo == '1'
        run: echo "C:\msys64\ucrt64\bin" >> $env:GITHUB_PATH
        shell: pwsh

      # The ONNX model and runtime are gitignored build inputs
      # (internal/localembedder/assets). Only CGO builds embed them; CGO_ENABLED=0
      # builds need nothing, which is why the lexical-only build stays small.
      - name: Cache model + ONNX runtime
        id: assets
        if: matrix.cgo == '1'
        uses: actions/cache@v4
        with:
          path: |
            internal/localembedder/assets/model.onnx
            internal/localembedder/assets/onnxruntime.dll
            internal/localembedder/assets/libonnxruntime.so
            internal/localembedder/assets/libonnxruntime.dylib
          key: assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/download_assets.go', 'internal/modelspec/spec.go') }}

      - name: Fetch model and ONNX runtime
        if: matrix.cgo == '1' && steps.assets.outputs.cache-hit != 'true'
        run: go run scripts/download_assets.go

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector requires cgo; the cgo=0 leg runs a plain test pass instead.
      - name: Test (race)
        if: matrix.cgo == '1'
        run: go test -race ./...

      - name: Test
        if: matrix.cgo == '0'
        run: go test ./...

  # Crash safety and format compatibility: kill -9 fault injection, the golden
  # files written by earlier releases, and the migration path. These also run in
  # the matrix above; this job soaks the randomized kill test with many more
  # rounds on every OS, since a flush or compaction interrupted at the wrong
  # instant is exactly the kind of bug a few rounds can miss.
  durability:
    name: durability / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "0"
      ZENITH_CRASH_ROUNDS: "40"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true

      - name: Crash recovery, layered-vs-in-memory equivalence, golden files, migration
        run: >
          go test ./internal/index/ ./internal/segment/ ./pkg/zenith/
          -run 'TestCrash|TestLayered|TestGolden|TestMigrate|TestSave_Refuses|TestOpen_Legacy'
          -count=1 -timeout 20m -v

      # Power loss (every fsync/rename/dir-sync boundary, torn pages), full disk,
      # the non-blocking checkpoint and WAL rotation, and the persisted ANN graph.
      # On Linux and macOS this is also the first execution of the mmap path.
      - name: Power loss, disk full, checkpoints, frozen layer, ANN persistence
        run: >
          go test ./internal/fsx/ ./internal/index/ ./internal/ann/ ./internal/storage/wal/ ./pkg/zenith/
          -run 'TestPowerLoss|TestDiskFull|TestCheckpoint|TestFrozen|TestANNPersist|TestPersist|TestRotate|TestAppend_DiskFull|TestRecorder|TestAttrIndex|TestFilter'
          -count=1 -timeout 30m -v

  # Latency and recall regression gate for the lexical query path. Deterministic
  # synthetic corpus (no download); asserts a recall floor, a bound on candidates
  # per query (machine-independent, the sharp check), and a loose p50 ceiling.
  # Verified to FAIL on the pre-optimisation behaviour. Real-corpus (MS MARCO)
  # numbers are measured manually: see CONTRIBUTING.md.
  latency-gate:
    name: latency gate
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true

      - name: Lexical latency / recall gate
        run: go test ./internal/index/ -run TestLexicalLatencyGate -count=3 -v
