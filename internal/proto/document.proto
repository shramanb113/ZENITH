syntax = "proto3";

package zenith;

option go_package = "gen/go/zenithproto";

service SearchService {
    rpc IndexDocuments(IndexRequest) returns (IndexResponse);
    rpc Search(SearchRequest) returns (SearchResponse);
    rpc IndexPDF(IndexPDFRequest) returns (IndexPDFResponse);
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
    rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
}

// AttrValue is one typed metadata value: a string, a number, a bool, or an
// array of the first three (never nested — an array element is never itself
// an array). eq/in on an array field mean "any element matches".
message AttrValue {
    oneof kind {
        string string_value = 1;
        double number_value = 2;
        bool   bool_value   = 3;
        AttrValueArray array_value = 4;
    }
}

message AttrValueArray {
    repeated AttrValue values = 1;
}

message IndexRequest {
    string id = 1;
    string data = 2;
    // attrs is metadata stored with the document; SearchRequest.filter can
    // restrict a search to documents whose attrs match.
    map<string, AttrValue> attrs = 3;
}

// FilterNode is a filter expression: a condition, or and/or/not of others.
// The operators mean the same as Eq/In/Range/Exists/And/Or/Not in the Go
// package: a document without the field never matches a condition on it, a
// type mismatch never matches, and NOT matches documents that lack the field.
message FilterNode {
    oneof node {
        FilterCondition condition = 1;
        FilterGroup     and       = 2;
        FilterGroup     or        = 3;
        FilterNode      not       = 4;
    }
}

message FilterGroup {
    repeated FilterNode nodes = 1;
}

message FilterCondition {
    enum Op {
        EQ       = 0; // values[0] equals the field
        IN       = 1; // the field equals any of values
        RANGE    = 2; // numeric field within [min, max]; either bound may be omitted
        EXISTS   = 3; // the field is present
        PREFIX   = 4; // string field starts with values[0]
        CONTAINS = 5; // string field contains values[0] as a substring
    }
    string field = 1;
    Op op = 2;
    repeated AttrValue values = 3;
    optional double min = 4;
    optional double max = 5;
}

message IndexResponse {
    bool status = 1;
    string message = 2;
}

message SearchRequest{
    string query = 1 ;
    // limit caps the number of results returned. 0 or unset defaults to 10.
    int32 limit = 2;
    // offset skips this many results from the top of the ranked list, for pagination.
    int32 offset = 3;
    // filter, when set, restricts the search to documents whose attrs match.
    FilterNode filter = 4;
    // sort_field, when non-empty, replaces score ordering entirely: results
    // are ordered by this attribute's value instead (stable, so documents
    // tied on it — including every document missing it — keep their
    // relative score order). A document missing the field, or holding an
    // array value, always sorts after every document with a comparable
    // scalar value, regardless of sort_desc.
    string sort_field = 5;
    bool sort_desc = 6;
}

message SearchResult {
    string id = 1;
    double score = 2;
    map<string, string> fields = 3;
    string original_text = 4;
    // attrs are the document's metadata (empty if it has none).
    map<string, AttrValue> attrs = 5;
}

message SearchResponse {
    repeated SearchResult results = 1;
}

message DocumentProto {

    string id = 1;
    map<string,string> fields = 2;
    map<string,Vector> vectors = 3;

    bytes metadata = 4;
    int64 version = 5;
    string status = 6;
}

message Vector {
    repeated float elements = 1;
}

message IndexPDFRequest {
    string document_id = 1;
    string file_path   = 2;
}

message IndexPDFResponse {
    bool   status         = 1;
    string message        = 2;
    int32  chunks_indexed = 3;
}

message GetDocumentRequest {
    string id = 1;
}

message GetDocumentResponse {
    bool   found = 1;
    string id    = 2;
    string text  = 3;
}

message DeleteDocumentRequest {
    string id = 1;
}

message DeleteDocumentResponse {
    bool   status  = 1;
    string message = 2;
}
