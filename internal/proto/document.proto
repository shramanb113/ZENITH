syntax = "proto3";

package zenith;

option go_package = "gen/go/zenithproto";

service SearchService {
    rpc IndexDocuments(IndexRequest) returns (IndexResponse);
    rpc Search(SearchRequest) returns (SearchResponse);
    rpc IndexPDF(IndexPDFRequest) returns (IndexPDFResponse);
    rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
    rpc DeleteDocument(DeleteDocumentRequest) returns (DeleteDocumentResponse);
    // IndexBatch indexes every document atomically (one durable commit, all
    // or nothing). Returns UNIMPLEMENTED when the server has no transactional
    // storage engine wired.
    rpc IndexBatch(IndexBatchRequest) returns (IndexBatchResponse);
    // DeleteBatch removes every id atomically (one durable commit, all or
    // nothing). Returns UNIMPLEMENTED when the server has no transactional
    // storage engine wired.
    rpc DeleteBatch(DeleteBatchRequest) returns (DeleteBatchResponse);
    // Suggest returns indexed terms starting with a prefix (autocomplete).
    rpc Suggest(SuggestRequest) returns (SuggestResponse);
}

// AttrValue is one typed metadata value: a string, a number, a bool, or an
// array of the first three (never nested — an array element is never itself
// an array). eq/in on an array field mean "any element matches".
message AttrValue {
    oneof kind {
        string string_value = 1;
        double number_value = 2;
        bool   bool_value   = 3;
        AttrValueArray array_value = 4;
    }
}

message AttrValueArray {
    repeated AttrValue values = 1;
}

message IndexRequest {
    string id = 1;
    string data = 2;
    // attrs is metadata stored with the document; SearchRequest.filter can
    // restrict a search to documents whose attrs match.
    map<string, AttrValue> attrs = 3;
}

// FilterNode is a filter expression: a condition, or and/or/not of others.
// The operators mean the same as Eq/In/Range/Exists/And/Or/Not in the Go
// package: a document without the field never matches a condition on it, a
// type mismatch never matches, and NOT matches documents that lack the field.
message FilterNode {
    oneof node {
        FilterCondition condition = 1;
        FilterGroup     and       = 2;
        FilterGroup     or        = 3;
        FilterNode      not       = 4;
    }
}

message FilterGroup {
    repeated FilterNode nodes = 1;
}

message FilterCondition {
    enum Op {
        EQ       = 0; // values[0] equals the field
        IN       = 1; // the field equals any of values
        RANGE    = 2; // numeric field within [min, max]; either bound may be omitted
        EXISTS   = 3; // the field is present
        PREFIX   = 4; // string field starts with values[0]
        CONTAINS = 5; // string field contains values[0] as a substring
    }
    string field = 1;
    Op op = 2;
    repeated AttrValue values = 3;
    optional double min = 4;
    optional double max = 5;
}

message IndexResponse {
    bool status = 1;
    string message = 2;
}

message SearchRequest{
    string query = 1 ;
    // limit caps the number of results returned. 0 or unset defaults to 10.
    int32 limit = 2;
    // offset skips this many results from the top of the ranked list, for pagination.
    int32 offset = 3;
    // filter, when set, restricts the search to documents whose attrs match.
    FilterNode filter = 4;
    // sort_field, when non-empty, replaces score ordering entirely: results
    // are ordered by this attribute's value instead (stable, so documents
    // tied on it — including every document missing it — keep their
    // relative score order). A document missing the field, or holding an
    // array value, always sorts after every document with a comparable
    // scalar value, regardless of sort_desc.
    string sort_field = 5;
    bool sort_desc = 6;
    // Per-query ranking overrides, for this call only. Unset (or 0) keeps the
    // engine default for that weight; NaN, Inf and negative values are
    // rejected with INVALID_ARGUMENT.
    //   vector_weight:   RRF weight of the semantic list (keyword list is fixed at 1.0)
    //   phonetic_weight: per-match weight of a Soundex phonetic hit
    //   rrf_k:           the k in RRF's weight/(k + rank)
    optional double vector_weight = 7;
    optional double phonetic_weight = 8;
    optional double rrf_k = 9;
    // facet_fields, when non-empty, asks for per-value document counts of
    // these attributes over the full fused candidate list (before
    // offset/limit; at most the engine's internal candidate cap, 1000 by
    // default). An array attribute counts once per distinct element. With an
    // empty query, facets are counted over every live document instead and
    // no results are returned.
    repeated string facet_fields = 10;
    // facet_top_k caps the values returned per field (highest count first).
    // 0 or unset defaults to 10.
    int32 facet_top_k = 11;
}

message SearchResult {
    string id = 1;
    double score = 2;
    map<string, string> fields = 3;
    string original_text = 4;
    // attrs are the document's metadata (empty if it has none).
    map<string, AttrValue> attrs = 5;
}

message SearchResponse {
    repeated SearchResult results = 1;
    // facets is filled only when SearchRequest.facet_fields is set: one entry
    // per (field, value), grouped by field in request order, highest count
    // first within a field.
    repeated FacetResult facets = 2;
}

message FacetResult {
    string field = 1;
    AttrValue value = 2;
    int64 count = 3;
}

message DocumentProto {

    string id = 1;
    map<string,string> fields = 2;
    map<string,Vector> vectors = 3;

    bytes metadata = 4;
    int64 version = 5;
    string status = 6;
}

message Vector {
    repeated float elements = 1;
}

message IndexPDFRequest {
    string document_id = 1;
    string file_path   = 2;
    // attrs is metadata attached to every chunk indexed from this PDF.
    map<string, AttrValue> attrs = 3;
}

message IndexPDFResponse {
    bool   status         = 1;
    string message        = 2;
    int32  chunks_indexed = 3;
}

message GetDocumentRequest {
    string id = 1;
}

message GetDocumentResponse {
    bool   found = 1;
    string id    = 2;
    string text  = 3;
    // attrs are the document's metadata (empty if it has none).
    map<string, AttrValue> attrs = 4;
}

message DeleteDocumentRequest {
    string id = 1;
}

message DeleteDocumentResponse {
    bool   status  = 1;
    string message = 2;
}

message IndexBatchRequest {
    repeated IndexRequest docs = 1;
}

message IndexBatchResponse {
    bool   status  = 1;
    string message = 2;
    int32  indexed = 3;
}

message DeleteBatchRequest {
    repeated string ids = 1;
}

message DeleteBatchResponse {
    bool   status  = 1;
    string message = 2;
    int32  deleted = 3;
}

// SuggestRequest asks for indexed terms starting with prefix. Terms are the
// analysed (lowercased, Porter2-stemmed) vocabulary, returned in
// lexicographic order — not ranked by frequency, and not surface forms
// ("running" is indexed, and suggested, as "run").
message SuggestRequest {
    string prefix = 1;
    // limit caps the number of terms returned. 0 or unset defaults to 10.
    int32 limit = 2;
}

message SuggestResponse {
    repeated string terms = 1;
}
